name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            target: darwin-x64
            suffix: Darwin_x86_64
          - os: macos-latest
            target: darwin-arm64
            suffix: Darwin_arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Binary
        run: bun scripts/build.ts bun-${{ matrix.target }} dist/podapple

      - name: Package
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCHIVE_NAME="podapple_${VERSION}_${{ matrix.suffix }}.tar.gz"

          cd dist
          tar -czf "../$ARCHIVE_NAME" podapple
          cd ..

          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Checksums
        run: |
          cd artifacts
          # Flatten artifacts (move from subdirs to root of artifacts/)
          find . -type f -name "*.tar.gz" -exec mv {} . \;

          shasum -a 256 *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
