name: Build Assets

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to build for (e.g. v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: darwin-x64
            suffix: Darwin_x86_64
          - os: macos-latest
            target: darwin-arm64
            suffix: Darwin_arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Binary
        run: bun scripts/build.ts bun-${{ matrix.target }} dist/podapple

      - name: Package
        run: |
          # Use passed tag name
          VERSION="${{ inputs.tag_name }}"
          VERSION=${VERSION#v}
          ARCHIVE_NAME="podapple_${VERSION}_${{ matrix.suffix }}.tar.gz"

          cd dist
          tar -czf "../$ARCHIVE_NAME" podapple
          cd ..

          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 1

  upload:
    name: Upload Assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate Checksums
        run: |
          cd artifacts
          find . -type f -name "*.tar.gz" -exec mv {} . \;
          shasum -a 256 *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
