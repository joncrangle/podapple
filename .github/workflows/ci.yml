name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: ["*"]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Dependencies
        run: bun install
      - name: Lint & Format
        run: bun run lint
      - name: Type Check
        run: bun run tsc --noEmit
      - name: Run Tests
        run: bun test
      - name: Build
        run: bun run build
